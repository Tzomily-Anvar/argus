name: Bug report
description: Something Argus does, shows or says is wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A few lines on each of these is plenty.

        **Please do not paste tokens, session files, or your organisation's
        data** - repository names, ticket keys, people's names, screenshots
        of the dashboard. Describe the shape of the problem instead
        (`ABC-123`, `your-org`, "a pull request with two approvals").
        Argus holds nothing of yours, and neither should this issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `argus version` (or `./run.sh doctor` on Docker).
      placeholder: argus 0.2.0 (abc1234)
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system and architecture.
      placeholder: macOS 15 arm64 / Ubuntu 24.04 amd64 / Windows 11
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it was installed
      options:
        - Homebrew
        - Linux package (.deb / .rpm / .apk)
        - Release archive
        - Docker / run.sh
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Which tool
      options:
        - Pull requests
        - Sprint report
        - Backlog
        - Leaderboard
        - Setup, login or the CLI
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Argus did instead. Error text verbatim is useful; `argus doctor` output usually is too.
    validations:
      required: true
  - type: checkboxes
    id: checked
    attributes:
      label: Before posting
      options:
        - label: I have left tokens, session files and my organisation's data out of this report.
          required: true
