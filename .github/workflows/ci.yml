# Runs on every pull request and every push to main.
#
# The point of this file is that a contributor's pull request is checked
# before a human looks at it, and that main never silently drifts out of
# a working state.
#
# Action versions are pinned to a major tag rather than floating: a public
# repository runs whatever a third-party action's default branch happens
# to contain, so pinning is the difference between a supply chain you
# chose and one you inherited.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. Nothing here needs to write to the repository, and
# a token that cannot write cannot be abused into writing.
permissions:
  contents: read

concurrency:
  # A new push supersedes the run already in flight for that branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest

    services:
      # The store has two backends and they are only trustworthy because
      # the same conformance suite runs against both. Without a database
      # here, half of that guarantee would go unchecked on every pull
      # request.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: argus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          # gofmt exits 0 whatever it finds, so the check is on its output.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Cross-compile the released targets
        run: |
          # Installing the background service has a path per operating
          # system - launchd, systemd, the Windows task scheduler - and each
          # one only compiles on its own GOOS. Everything else in this file
          # runs on Linux, so without this the Windows path is never built
          # by anyone and a tag is the first thing to try it.
          #
          # These are the goos/goarch pairs in .goreleaser.yaml. CGO is off
          # for the same reason it is off there: the release binary is
          # static.
          for target in darwin/amd64 darwin/arm64 \
                        linux/amd64 linux/arm64 \
                        windows/amd64 windows/arm64; do
            echo "building ${target}"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build ./...
          done

      - name: Tests
        env:
          ARGUS_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/argus_test?sslmode=disable
        run: go test -race ./...

      - name: Tidy go.mod
        run: |
          # A go.mod that does not match the imports means someone added a
          # dependency without tidying, and the next person gets the noise.
          go mod tidy
          git diff --exit-code go.mod go.sum

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        # ci, not install: it installs exactly the lockfile and fails if
        # package.json and the lockfile disagree.
        run: npm ci

      - name: Types
        run: npx tsc -b --force

      - name: Build
        run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds the real multi-stage image, which is the only way to catch a
      # Dockerfile that breaks while the Go and npm builds both pass.
      # Loaded rather than pushed - nothing here publishes anything.
      - name: Build
        run: docker build -t argus:ci .

      - name: Check it starts and answers
        run: |
          docker run -d --name argus-ci -p 18474:18474 \
            -e ARGUS_GITHUB_ORG=example \
            -e ARGUS_GITHUB_TOKEN=not-a-real-token \
            -e ARGUS_BIND=0.0.0.0 \
            argus:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:18474/healthz >/dev/null 2>&1; then
              echo "healthy"
              exit 0
            fi
            sleep 1
          done
          echo "did not become healthy; logs:"
          docker logs argus-ci
          exit 1

  leaks:
    name: Credential scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, not the one commit a shallow clone would
          # give it: a token that was committed and then removed is still
          # in the repository, and still works.
          fetch-depth: 0

      # The same script the pre-commit and pre-push hooks run, in the mode
      # that reads no pattern file. Contributors keep their own private
      # patterns on their own machines; this job checks only for issued
      # credentials, from the patterns built into the script, and it must
      # stay that way. A pattern file here - as a secret, a checked-in
      # file, anything - would put the strings it exists to withhold into
      # a public repository's build.
      - name: Scan the history for credentials
        run: ./scripts/private-check.sh --generic --all

  release:
    name: Release build
    runs-on: ubuntu-latest

    env:
      # The GoReleaser action looks its own release up through the API, and
      # without a token that is the anonymous rate limit shared with every
      # other runner on the machine. This is the read-only token declared at
      # the top of this file; nothing in this job publishes anything.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          # A snapshot version is derived from the nearest tag, so the tags
          # have to be here - same reason the release workflow does this.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Config first, because it needs nothing built: a typo in
      # .goreleaser.yaml is worth hearing about before anyone waits on an
      # npm install, and nothing else in this repository ever reads it.
      - name: Check the release config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The dashboard is compiled into the binary, so it has to exist before
      # the Go build runs. The release workflow does these same two steps
      # ahead of GoReleaser for the same reason.
      - name: Build the dashboard
        run: npm ci && npm run build
        working-directory: web

      # Everything a tag does except the publishing: the archives, the
      # Windows zip, the checksums and the files each archive is meant to
      # carry. A renamed doc or a broken name template fails here, on the
      # pull request that caused it, rather than halfway through a release.
      # --skip=before because the dashboard was just built above.
      - name: Build the release artefacts
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=before
