# One service. No database, no sidecar, nothing to provision.
#
# The container is meant to be left running: it sweeps in the background
# and serves from memory, so the dashboard is instant whenever you open
# it. That is also why the port is deliberately unusual - 18474 will not
# collide with a dev server on 3000, 5173, 8000 or 8080.
name: argus

services:
  argus:
    build: .
    image: argus
    container_name: ${ARGUS_CONTAINER_NAME:-argus}
    ports:
      # Published to loopback ONLY. Without the 127.0.0.1 prefix Docker
      # binds every interface, and anyone on your network could read your
      # organisation's data through your token, unauthenticated.
      - "127.0.0.1:${ARGUS_PORT:-18474}:18474"

    # Non-secret settings come from .env, which Compose reads automatically.
    env_file:
      - path: .env
        required: false

    environment:
      # The token is injected at `up` time by run.sh, from 1Password or
      # from your gh login. It is never written to a file or baked into
      # the image.
      ARGUS_GITHUB_TOKEN: "${ARGUS_GITHUB_TOKEN:-}"

      # Jira, for the sprint report. Resolved by run.sh from 1Password or
      # your environment, and absent unless the tool is enabled.
      ARGUS_JIRA_EMAIL: "${ARGUS_JIRA_EMAIL:-}"
      ARGUS_JIRA_TOKEN: "${ARGUS_JIRA_TOKEN:-}"
      # Docker forwards to the container's address, not its loopback, so
      # the server must listen broadly *inside* the container. The port
      # mapping above is what limits real exposure to this machine.
      ARGUS_BIND: "0.0.0.0"

    volumes:
      # The sprint report stores baselines, capacity and notes. It lives
      # on a volume so it survives rebuilds, and never inside the repo.
      - argus-data:/data

    # Come back after a reboot, and after a crash, until explicitly stopped.
    restart: unless-stopped

    # distroless has no shell, so the healthcheck calls the binary itself.
    healthcheck:
      test: ["CMD", "/argus", "-healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  argus-data:
